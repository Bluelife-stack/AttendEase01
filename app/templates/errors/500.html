{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block page_title %}Error 500{% endblock %}

{% block content %}
<div class="empty-state empty-state--page">
  <svg class="empty-icon text-danger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
    <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
  </svg>
  <h2>Internal Server Error</h2>
  <p>An unexpected error occurred while processing your request. Please check the logs or try again.</p>
  <div style="margin-top: 1rem;">
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary btn-sm">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
